name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'GlowAndroid-Project.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: unzip -q GlowAndroid-Project.zip -d android-source
      - name: Build debug APK
        run: gradle -p android-source/GlowAndroid-clean-v2 assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Glow-Android-APK
          path: android-source/GlowAndroid-clean-v2/app/build/outputs/apk/debug/app-debug.apk
